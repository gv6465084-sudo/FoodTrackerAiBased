<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NutriTrack</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card animate-slide-up">
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to continue your health journey</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label form-label-required" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label class="form-label form-label-required" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
        </div>

        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
          <label class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <span class="form-check-label">Remember me</span>
          </label>
          <a href="#" style="font-size: 0.875rem; color: var(--primary);">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 1rem;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const result = App.UserManager.login(email, password);
      
      if (result.success) {
        App.Toast.success('Welcome back!', 'Login Successful');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } else {
        App.Toast.error(result.message, 'Login Failed');
      }
    });
  </script>
</body>
</html>
