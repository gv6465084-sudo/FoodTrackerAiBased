<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - NutriTrack</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card animate-slide-up">
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Start your journey to a healthier you</p>
      </div>

      <form id="registerForm">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label form-label-required" for="firstName">First Name</label>
            <input type="text" id="firstName" class="form-input" placeholder="John" required>
          </div>
          <div class="form-group">
            <label class="form-label form-label-required" for="lastName">Last Name</label>
            <input type="text" id="lastName" class="form-input" placeholder="Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label form-label-required" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="john@example.com" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label form-label-required" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Min 6 characters" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label form-label-required" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat password" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" class="form-check-input" id="terms" required>
            <span class="form-check-label">I agree to the <a href="#" style="color: var(--primary);">Terms of Service</a> and <a href="#" style="color: var(--primary);">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 1rem;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="index.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (password !== confirmPassword) {
        App.Toast.error('Passwords do not match', 'Validation Error');
        return;
      }
      
      const userData = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        password: password
      };
      
      const result = App.UserManager.register(userData);
      
      if (result.success) {
        App.Toast.success('Account created successfully!', 'Welcome');
        setTimeout(() => {
          window.location.href = 'onboarding.html';
        }, 500);
      } else {
        App.Toast.error(result.message, 'Registration Failed');
      }
    });
  </script>
</body>
</html>
